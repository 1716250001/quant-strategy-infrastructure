schema_version: "backtest.v1"
run:
  strategy: "myapp.strategies:RotationStrategy"
  universe: {source: "index", index: "hs300", as_of: "2020-01-01", include_delisted: true}
  period: {start: "2018-01-01", end: "2024-12-31", anchor: "2024-12-31"}
  initial_cash: 1_000_000
data:
  feed: "tushare_parquet"
  dataset: {version: "tushare.v5.3", rules: "v7.7"}
  # v0.5.1（19 号 P1-5）：completeness.missing_bars_action/max 为死键已删除；
  # 区间完整性由装配期覆盖度校验承接（data.allow_degraded_limit 控制降级）
  # allow_degraded_limit: false   # 默认 false：区间早于 stk_limit 起点即报错
execution:
  handler: "next_open"
  cost_model: "tiered_v1"
  # RC-01（2026-10-05）：默认已非零摩擦（单边 10bp）。
  # 零摩擦基线需**显式声明** `{model: "none"}`（装配期 warn + 报告披露）。
  slippage: {model: "pct", params: {pct: 0.001}}
risk:
  rules: [{name: "max_weight", params: {limit: 0.10}}, {name: "cash_check"}, {name: "tradability"}]
rules:
  source: "mirror_json"
  # 由 tools/export_rules_mirror.py 导出后填绝对路径；示例不指向任何私有仓
  path: "<RULES_MIRROR_JSON_ABS_PATH>"
  overrides: []
seed: {master: 20260926}
report:
  sections: [summary, equity, drawdown, monthly_heat, trades, assumptions]
  benchmark: "000300.SH"
